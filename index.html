<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Brinckhaus Presupuestos</title>

<!-- PWA -->
<meta name="theme-color" content="#12496b" />
<meta name="description" content="Generador de presupuestos para herrería / metalúrgica" />
<link rel="manifest" href="manifest.json" />

<!-- iOS install support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Presupuestos" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <img id="header-logo" class="header-logo" src="" alt="Logo" hidden />
    <h1 id="header-title" data-i18n="app_title">Presupuestos</h1>
  </div>
  <nav class="header-actions">
    <button id="btn-settings" class="icon-btn" title="Ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.63l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.43h-3.84a.5.5 0 0 0-.5.43l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.85a.5.5 0 0 0 .12.63l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.63l1.92 3.32c.14.24.42.32.66.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.25.43.5.43h3.84c.25 0 .45-.19.5-.43l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.24.1.52.02.66-.22l1.92-3.32a.5.5 0 0 0-.12-.63l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
    </button>
  </nav>
</header>

<main id="app-main">

  <!-- LIST VIEW -->
  <section id="view-list" class="view active">
    <div class="list-toolbar">
      <input id="search-input" type="search" data-i18n-placeholder="search_placeholder" placeholder="Buscar por cliente o N°..." />
    </div>
    <div id="quotes-list" class="quotes-list"></div>
    <p id="empty-state" class="empty-state" data-i18n="empty_state" hidden>Todavía no creaste ningún presupuesto.</p>
    <button id="btn-new-quote" class="fab" title="Nuevo presupuesto" aria-label="Nuevo presupuesto">+</button>
  </section>

  <!-- FORM VIEW (create / edit) -->
  <section id="view-form" class="view">
    <div class="view-header">
      <button class="btn-back" id="btn-form-back" aria-label="Volver">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
      </button>
      <h2 id="form-title" data-i18n="new_quote_title">Nuevo presupuesto</h2>
    </div>

    <form id="quote-form" class="quote-form">
      <div class="field-grid">
        <label class="field">
          <span data-i18n="quote_number">N° de presupuesto</span>
          <input type="text" id="f-quote-number" />
        </label>
        <label class="field">
          <span data-i18n="date">Fecha</span>
          <input type="date" id="f-date" required />
        </label>
      </div>

      <label class="field">
        <span data-i18n="client_name">Cliente</span>
        <input type="text" id="f-client-name" required />
      </label>

      <div class="field-grid">
        <label class="field">
          <span data-i18n="client_phone">Teléfono del cliente</span>
          <input type="tel" id="f-client-phone" placeholder="+54 9 ..." />
        </label>
        <label class="field">
          <span data-i18n="client_email">Email del cliente</span>
          <input type="email" id="f-client-email" />
        </label>
      </div>

      <h3 class="section-title" data-i18n="items">Ítems del presupuesto</h3>
      <div id="items-container"></div>
      <button type="button" id="btn-add-item" class="btn btn-outline" data-i18n="add_item">+ Agregar ítem</button>

      <div class="grand-total-row">
        <span data-i18n="grand_total">Total del presupuesto</span>
        <strong id="grand-total-display">$0</strong>
      </div>

      <label class="field">
        <span data-i18n="notes">Notas / condiciones de pago</span>
        <textarea id="f-notes" rows="3" placeholder="Ej: 60% al iniciar, 40% al finalizar"></textarea>
      </label>

      <div class="form-actions">
        <button type="button" id="btn-cancel-form" class="btn btn-text" data-i18n="cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" data-i18n="save">Guardar</button>
      </div>
    </form>
  </section>

  <!-- DETAIL VIEW -->
  <section id="view-detail" class="view">
    <div class="view-header">
      <button class="btn-back" id="btn-detail-back" aria-label="Volver">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
      </button>
      <h2 data-i18n="quote_detail">Presupuesto</h2>
    </div>
    <div id="detail-content" class="detail-content"></div>
    <div class="detail-actions">
      <button id="btn-detail-edit" class="btn btn-outline" data-i18n="edit">Editar</button>
      <button id="btn-detail-pdf" class="btn btn-outline" data-i18n="download_pdf">Descargar PDF</button>
      <button id="btn-detail-share" class="btn btn-primary" data-i18n="share">Compartir</button>
      <button id="btn-detail-delete" class="btn btn-danger" data-i18n="delete">Eliminar</button>
    </div>
  </section>

  <!-- SETTINGS VIEW -->
  <section id="view-settings" class="view">
    <div class="view-header">
      <button class="btn-back" id="btn-settings-back" aria-label="Volver">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
      </button>
      <h2 data-i18n="settings">Ajustes de la empresa</h2>
    </div>

    <form id="settings-form" class="quote-form">
      <label class="field">
        <span data-i18n="company_name">Nombre de la empresa</span>
        <input type="text" id="s-company-name" />
      </label>
      <label class="field">
        <span data-i18n="company_address">Dirección</span>
        <input type="text" id="s-company-address" />
      </label>
      <div class="field-grid">
        <label class="field">
          <span data-i18n="company_phone">Teléfono</span>
          <input type="text" id="s-company-phone" />
        </label>
        <label class="field">
          <span data-i18n="company_email">Email</span>
          <input type="email" id="s-company-email" />
        </label>
      </div>

      <label class="field">
        <span data-i18n="company_logo">Logo de la empresa</span>
        <!--
          The user picks an image file here; app.js reads it with FileReader
          and converts it to a base64 data URL before storing it in
          Storage settings (logoBase64). Until a custom logo is chosen, the
          app falls back to the bundled PNG at assets/logo/MB.png -- replace
          that file directly if you'd rather ship a different default logo
          without touching any code.
        -->
        <input type="file" id="s-company-logo-file" accept="image/png,image/jpeg,image/svg+xml" />
      </label>
      <div id="logo-preview-wrap">
        <img id="logo-preview" alt="Logo preview" />
        <button type="button" id="btn-remove-logo" class="btn btn-text" data-i18n="use_default_logo">Usar logo por defecto</button>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-i18n="save">Guardar</button>
      </div>
    </form>

    <!-- Low-key language switch, not part of main navigation, kept for future use -->
    <div class="lang-switch">
      <button id="btn-lang-toggle" type="button">ES / EN</button>
    </div>
  </section>

</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="confirm-modal" class="modal hidden">
  <div class="modal-box">
    <p id="confirm-message" data-i18n="confirm_delete">¿Eliminar este presupuesto? Esta acción no se puede deshacer.</p>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn btn-text" data-i18n="cancel">Cancelar</button>
      <button id="confirm-ok" class="btn btn-danger" data-i18n="delete">Eliminar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/logo-default.js"></script>
<script src="js/utils.js"></script>
<script src="js/pdf-generator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
